name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint, tipos e build
    runs-on: ubuntu-latest

    # O build prerenderiza páginas que são Server Component e consultam o
    # banco, então precisa de um Postgres de verdade — descartável, só do job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kibrindes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/kibrindes_ci?schema=public
      SESSION_SECRET: segredo-de-ci-nao-usar-em-producao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` já dispara o postinstall com `prisma generate`.
      - name: Instalar dependências
        run: npm ci

      - name: Aplicar migrations
        run: npm run db:deploy

      # O seed roda pra o build encontrar catálogo: sem produtos, as páginas
      # prerenderizadas ficariam vazias e um erro de query passaria batido.
      - name: Popular catálogo
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Cache do build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
