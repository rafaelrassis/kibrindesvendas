name: Sincronizar fornecedor

# Chama a rota de sync de hora em hora. Quem decide se roda de fato é a agenda
# salva em /admin/configuracoes — fora do horário a rota só responde "nada a
# fazer". O plano gratuito da Vercel só permite cron 1x por dia, por isso o
# agendador fica aqui.
#
# Precisa de dois secrets no repositório (Settings → Secrets → Actions):
#   SITE_URL     ex: https://www.leokibrindes.com.br (sem barra no final)
#   CRON_SECRET  o mesmo valor da env CRON_SECRET na Vercel
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Chamar a sincronização
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SITE_URL/CRON_SECRET não configurados — sync ignorada."
            exit 0
          fi
          # Cada chamada processa um lote (limite de tempo da função); repete
          # enquanto sobrar produto pendente no ciclo.
          for i in $(seq 1 20); do
            resposta=$(curl -sS --fail-with-body --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/cron/sync-fornecedor")
            echo "$resposta"
            pendentes=$(echo "$resposta" | jq -r '.pendentes')
            if [ "$pendentes" = "0" ] || [ "$pendentes" = "null" ]; then
              break
            fi
          done
